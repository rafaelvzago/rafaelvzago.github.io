# Netlify: Deploy Previews for PRs. Production stays on GitHub Pages.
# Hugo Extended version pinned to match CI (.github/workflows/pages-deploy.yml).

[build]
    command = "git submodule update --init --recursive && hugo --minify --gc"
    publish = "public"

[build.environment]
    HUGO_VERSION = "0.147.4"
    HUGO_ENABLEGITINFO = "true"
    TZ = "America/Sao_Paulo"
    # Theme lives in git submodule themes/archie (checked out via git submodule above).

# Production branch builds are skipped — www.rafaelvzago.com is deployed via GitHub Pages.
# ignore: exit 0 = skip build; exit 1 = continue
[context.production]
    ignore = "exit 0"

# Pull/merge request previews.
# Use DEPLOY_PRIME_URL (https://… on Netlify builders). Do not rely on local
# `netlify deploy --build --context deploy-preview` for branches with "/" in the
# name — the CLI can invent a broken baseURL (host=feat, path=/fix-…).
[context.deploy-preview]
    command = "git submodule update --init --recursive && hugo --minify --gc --baseURL \"$DEPLOY_PRIME_URL\""

[context.branch-deploy]
    command = "git submodule update --init --recursive && hugo --minify --gc --baseURL \"$DEPLOY_PRIME_URL\""
