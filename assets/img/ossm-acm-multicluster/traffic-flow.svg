<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de tráfego entre clusters</title>
  <desc id="desc">Uma requisição parte do cliente no primeiro spoke, é resolvida pelo control plane local, cruza um gateway east-west com mTLS e chega ao workload no segundo spoke.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ee0000"/>
    </marker>
    <marker id="arrowBack" markerWidth="14" markerHeight="14" refX="2" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M12,0 L0,6 L12,12 Z" fill="#0066cc"/>
    </marker>
    <style>
      .heading { font: 700 34px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #151515; }
      .subheading { font: 500 18px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5f6b76; }
      .title { font: 700 22px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #151515; }
      .body { font: 500 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5f6b76; }
      .body-light { font: 500 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #d2d2d2; }
      .title-light { font: 700 22px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
      .step { font: 700 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
      .protocol { font: 700 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #a30000; }
    </style>
  </defs>

  <rect width="1440" height="720" fill="#ffffff"/>
  <text x="720" y="54" text-anchor="middle" class="heading">Fluxo lógico de comunicação inter-cluster</text>
  <text x="720" y="84" text-anchor="middle" class="subheading">Descoberta remota no control plane; transporte seguro no data plane</text>

  <g filter="url(#shadow)">
    <rect x="70" y="180" width="280" height="250" rx="24" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/>
  </g>
  <circle cx="112" cy="222" r="22" fill="#151515"/>
  <text x="112" y="228" text-anchor="middle" class="step">1</text>
  <text x="100" y="278" class="title">Cliente no spoke 1</text>
  <text x="100" y="312" class="body">A aplicação chama um Service</text>
  <text x="100" y="337" class="body">global pelo nome Kubernetes.</text>
  <rect x="100" y="370" width="220" height="34" rx="17" fill="#e7f1fa"/>
  <text x="210" y="392" text-anchor="middle" class="body" fill="#004b95">Service: ratings.bookinfo</text>

  <g filter="url(#shadow)">
    <rect x="405" y="180" width="280" height="250" rx="24" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/>
  </g>
  <circle cx="447" cy="222" r="22" fill="#151515"/>
  <text x="447" y="228" text-anchor="middle" class="step">2</text>
  <text x="435" y="278" class="title">Istiod local</text>
  <text x="435" y="312" class="body">Remote Secrets fornecem</text>
  <text x="435" y="337" class="body">endpoints do segundo cluster.</text>
  <rect x="435" y="370" width="220" height="34" rx="17" fill="#e7f1fa"/>
  <text x="545" y="392" text-anchor="middle" class="body" fill="#004b95">meshNetworks + clusterName</text>

  <g filter="url(#shadow)">
    <rect x="755" y="150" width="300" height="310" rx="24" fill="#fff6f6" stroke="#ee0000" stroke-width="3"/>
  </g>
  <circle cx="797" cy="192" r="22" fill="#ee0000"/>
  <text x="797" y="198" text-anchor="middle" class="step">3</text>
  <text x="785" y="248" class="title">Gateway East-West</text>
  <text x="785" y="282" class="body">O protocolo depende do</text>
  <text x="785" y="307" class="body">data plane do workload:</text>
  <rect x="785" y="336" width="240" height="42" rx="12" fill="#ffffff" stroke="#ee0000"/>
  <text x="905" y="362" text-anchor="middle" class="protocol">Ambient · HBONE :15008</text>
  <rect x="785" y="390" width="240" height="42" rx="12" fill="#ffffff" stroke="#ee0000"/>
  <text x="905" y="416" text-anchor="middle" class="protocol">Sidecar · TLS :15443</text>

  <g filter="url(#shadow)">
    <rect x="1110" y="180" width="260" height="250" rx="24" fill="#ffffff" stroke="#d2d2d2" stroke-width="2"/>
  </g>
  <circle cx="1152" cy="222" r="22" fill="#151515"/>
  <text x="1152" y="228" text-anchor="middle" class="step">4</text>
  <text x="1140" y="278" class="title">Workload remoto</text>
  <text x="1140" y="312" class="body">O endpoint atende e responde</text>
  <text x="1140" y="337" class="body">pelo mesmo canal mTLS.</text>
  <rect x="1140" y="370" width="200" height="34" rx="17" fill="#e8f5e9"/>
  <text x="1240" y="392" text-anchor="middle" class="body" fill="#1b5e20">Identidade autenticada</text>

  <path d="M350 290 H405" stroke="#ee0000" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M685 290 H755" stroke="#ee0000" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M1055 290 H1110" stroke="#ee0000" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
  <path d="M1110 484 H350" stroke="#0066cc" stroke-width="5" fill="none" marker-end="url(#arrowBack)"/>
  <text x="730" y="516" text-anchor="middle" class="body" fill="#004b95">resposta mTLS</text>

  <rect x="235" y="565" width="970" height="100" rx="22" fill="#151515"/>
  <text x="720" y="598" text-anchor="middle" class="title-light">A base de confiança é compartilhada</text>
  <text x="720" y="628" text-anchor="middle" class="body-light">Uma Root CA comum assina uma Intermediate CA diferente para cada cluster.</text>
  <text x="720" y="651" text-anchor="middle" class="body-light">O tráfego de aplicação permanece criptografado ponta a ponta.</text>
</svg>
