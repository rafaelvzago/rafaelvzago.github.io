name: Build and deploy Hugo site

on:
  push:
    branches: ["main"]
    paths-ignore:
      - '.claude/**'
      - '.cursor/**'
      - 'docs/**'
      - '.scratch/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'PROGRESS.md'
      - 'README.md'
      - 'LICENSE'
      - 'Makefile'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.tool-versions'
  workflow_dispatch:

permissions:
  contents: write

env:
  HUGO_VERSION: "0.147.4"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build site
        run: |
          set -e
          hugo --minify --gc
          touch public/.nojekyll
          echo "www.rafaelvzago.com" > public/CNAME
        env:
          HUGO_ENVIRONMENT: production
          TZ: America/Sao_Paulo

      - name: Verify site directory
        run: |
          if [ ! -d "public" ] || [ ! -f "public/index.html" ]; then
            echo "ERROR: public/index.html not found after Hugo build"
            exit 1
          fi
          echo "Site directory contents:"
          ls -la public

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.7.3
        with:
          folder: public
          branch: gh-pages
          clean: true
