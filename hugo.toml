baseURL = "https://www.rafaelvzago.com/"
title = "Rafael Zago"
theme = "archie"
copyright = "© Rafael Zago"
enableGitInfo = true
defaultContentLanguage = "pt-br"
defaultContentLanguageInSubdir = false
timeZone = "America/Sao_Paulo"

# Code highlighting
pygmentsStyle = "monokai"
pygmentsCodeFences = true
pygmentsCodeFencesGuessSyntax = true

[pagination]
pagerSize = 10

[permalinks]
posts = "/posts/:slug/"

[params]
mode = "toggle"
useCDN = false
favicon = "/assets/img/favicons/favicon.ico"
mathjax = false
katex = false
mainSections = ["posts"]
customcss = ["css/post-layout.css", "css/copy-code.css", "css/image-lightbox.css"]
customCSS = ["css/post-layout.css", "css/copy-code.css", "css/image-lightbox.css"]
customJS = ["js/copy-code.js", "js/image-lightbox.js", "js/global-search.js"]

[params.gtm]
id = "GTM-592PS4S2"

[[params.social]]
name = "GitHub"
icon = "github"
url = "https://github.com/rafaelvzago"

[[params.social]]
name = "Twitter"
icon = "twitter"
url = "https://twitter.com/rafaelvzago"

[[params.social]]
name = "LinkedIn"
icon = "simple:linkedin"
url = "https://www.linkedin.com/in/rafaelvzago"

